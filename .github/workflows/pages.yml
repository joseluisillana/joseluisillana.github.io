name: Publish approved portal to Pages

on:
  workflow_dispatch:
    inputs:
      publishing_version:
        description: Published immutable publishing Release tag (vX.Y.Z)
        required: true
        type: string
      expected_sha:
        description: Full publishing commit SHA approved for this deployment
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: github-pages-publication
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Guard reviewed workflow and owner dispatch
        shell: bash
        env:
          PUBLISHING_VERSION: ${{ inputs.publishing_version }}
          EXPECTED_SHA: ${{ inputs.expected_sha }}
          ACTUAL_REF: ${{ github.ref }}
          ACTOR: ${{ github.actor }}
          REPOSITORY: ${{ github.repository }}
        run: |
          [[ "$ACTUAL_REF" == 'refs/heads/main' ]]
          [[ "$REPOSITORY" == 'joseluisillana/joseluisillana.github.io' ]]
          [[ "$ACTOR" == 'joseluisillana' ]]
          [[ "$PUBLISHING_VERSION" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
          [[ "$EXPECTED_SHA" =~ ^[0-9a-f]{40}$ ]]
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Fetch selected protected tag and exact candidate
        shell: bash
        env:
          PUBLISHING_VERSION: ${{ inputs.publishing_version }}
          EXPECTED_SHA: ${{ inputs.expected_sha }}
        run: |
          git fetch --no-tags origin "refs/tags/${PUBLISHING_VERSION}:refs/tags/${PUBLISHING_VERSION}"
          ACTUAL_SHA="$(git rev-parse "refs/tags/${PUBLISHING_VERSION}^{commit}")"
          [[ "$ACTUAL_SHA" == "$EXPECTED_SHA" ]]
          git worktree add --detach candidate "$EXPECTED_SHA"
      - name: Check published Release and protected provenance
        env:
          PUBLISHING_VERSION: ${{ inputs.publishing_version }}
          EXPECTED_SHA: ${{ inputs.expected_sha }}
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/check-release.mjs candidate
      - name: Check public inventory and hashes
        run: node scripts/check-output.mjs candidate
      - name: Upload reviewed public directory
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: candidate/public/

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy approved artifact
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
