name: Validate staged output

on:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Check public inventory and hashes
        run: node scripts/check-output.mjs
      - name: Check release policy
        run: node --test tests/*.test.mjs
